LAB_DESCRIPTION="A simple example two computers on a single lan"
LAB_VERSION=1.0
LAB_AUTHOR="L. Ariemma"
LAB_EMAIL=contact@kathara.org
LAB_WEB=http://www.kathara.org/

pc1[0]="A/00:00:00:00:00:01" #Qui stiamo forzando un Mac Address
pc1[image]="kathara/base"
pc1[ipv6]="false" #Disabilitiamo IPV6

pc2[0]="A/00:00:00:00:00:02"
pc2[image]="kathara/base"
pc2[ipv6]="false"

#Queste righe servono ad aggiungere Wireshark (Packet Sniffer)
wireshark[bridged]="true" #Connette il container con la macchina host
wireshark[port]="3000:3000" #Mappa la porta 3000 dell host con la porta 3000 dell ospite
wireshark[image]="lscr.io/linuxserver/wireshark" #Serve a condividere un interfaccia grafica sul browser del localhost
wireshark[num_terms]=0